
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Complaint Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Smart Complaint Management System</h1>
        <p>Submit your complaint and help us resolve your issue.</p>
    </header>

    <main class="container">
        <h2>Submit a Complaint</h2>

        <form id="complaintForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" required>

            <label for="subject">Complaint Subject</label>
            <input type="text" id="subject" required>

            <label for="description">Complaint Description</label>
            <textarea id="description" required></textarea>

            <button type="submit">Submit Complaint</button>
        </form>
    </main>

    <footer>
        <p>Smart Complaint Management System | B.Tech Project</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
